spring:
  application:
    name: balcao
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true

balcao:
  # Until there is login, every request acts for this shop (see ConfiguredBusiness).
  business-id: 00000000-0000-0000-0000-000000000001

management:
  endpoints:
    web:
      exposure:
        include: health
